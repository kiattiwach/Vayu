<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">
          {{ '::Menu:TaskTypes' | abpLocalization }}
        </h5>
      </div>
      <div class="text-end col col-md-6">
        <div class="text-lg-end pt-2">
          <button id="create" class="btn btn-primary" type="button" (click)="createTaskType()">
            <i class="fa fa-plus mx-1"></i>
            <span>{{ "::NewTaskType" | abpLocalization }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body">
    <ngx-datatable [rows]="taskType?.items" [count]="taskType?.totalCount" [list]="list" default>
      <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="name"></ngx-datatable-column>
      <ngx-datatable-column [name]="'::Type' | abpLocalization" prop="type">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ '::Enum:TaskTypeEnum:' + row.type | abpLocalization }}
        </ng-template>
      </ngx-datatable-column>
     <ngx-datatable-column [name]="'::CreationTime' | abpLocalization" prop="creationTime">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.creationTime | date }}
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>

<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <h3>{{ '::NewTaskType' | abpLocalization }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-group">
        <label for="name">{{ '::Name'| abpLocalization}}</label><span> * </span>
        <input type="text" id="name" class="form-control" formControlName="name" autofocus />
      </div>
      <div class="form-group">
        <label for="task-type-enum">{{ '::Type'| abpLocalization}}</label><span> * </span>
        <select class="form-control" id="task-type-enum" formControlName="type">
          <option [ngValue]="null">{{'::SelectTaskTypeEnum' | abpLocalization}}</option>
          <option [ngValue]="type.value" *ngFor="let type of taskTypes"> {{ '::Enum:TaskTypeEnum:' + type.key | abpLocalization }}</option>
        </select>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>
      {{ '::Close' | abpLocalization }}
    </button>

    <button class="btn btn-primary" (click)="save()" > <!--[disabled]="form.invalid"-->
      <i class="fa fa-check mr-1"></i>
      {{ '::Save' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
