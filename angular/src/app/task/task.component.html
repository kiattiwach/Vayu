<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">
          {{ '::Menu:Tasks' | abpLocalization }}
        </h5>
      </div>
      <div class="text-end col col-md-6">
        <div class="text-lg-end pt-2">
          <button *abpPermission="'Vayu.Tasks.Create'" id="create" class="btn btn-primary" type="button" (click)="create()">
            <i class="fa fa-plus me-1"></i>
            <span>{{ "::NewTask" | abpLocalization }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body">
    <ngx-datatable [rows]="tasks?.items" [count]="tasks?.totalCount" [list]="list" default>
      <ngx-datatable-column *ngIf="isDisplayActionMenu"
                            [name]="'::Actions' | abpLocalization"
                            [maxWidth]="150"
                            [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div ngbDropdown container="body" class="d-inline-block">
            <button
              class="btn btn-primary btn-sm dropdown-toggle"
              data-toggle="dropdown"
              aria-haspopup="true"
              ngbDropdownToggle>
              <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
            </button>
            <div ngbDropdownMenu>
              <button *abpPermission="'Vayu.Tasks.Edit'" ngbDropdownItem (click)="edit(row.task.id)">
                <i class="fa fa-pen-alt me-1"></i>
                {{ '::Edit' | abpLocalization }}
              </button>
              <button *abpPermission="'Vayu.Tasks.Delete'" ngbDropdownItem (click)="delete(row.task.id, row.task.name)">
                <i class="fa fa-trash-alt me-1"></i>
                {{ '::Delete' | abpLocalization }}
              </button>
            </div>
          </div>
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::Status' | abpLocalization" prop="task.status"></ngx-datatable-column>
      <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="task.name"></ngx-datatable-column>
      <ngx-datatable-column [name]="'::TaskType' | abpLocalization" prop="taskType.name"></ngx-datatable-column>
      <ngx-datatable-column [name]="'::Leader' | abpLocalization" prop="reader.name"></ngx-datatable-column>
      <ngx-datatable-column [name]="'::ContactPerson' | abpLocalization" prop="task.contactPerson"></ngx-datatable-column>
      <ngx-datatable-column [name]="'::ContactNumber' | abpLocalization" prop="task.contactNumber"></ngx-datatable-column>
      <ngx-datatable-column [name]="'::CreateDateTime' | abpLocalization" prop="task.createDateTime">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.task.createDateTime | date }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::CompleteDateTime' | abpLocalization" prop="task.completeDateTime">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.task.completeDateTime | date }}
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>
