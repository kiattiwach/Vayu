<abp-advanced-entity-filters [list]="list" localizationSourceName="Vayu" entityFilterPlaceholder="::SearchPlaceholder">
  <abp-advanced-entity-filters-above-search>
    <h3>{{"::Search" | abpLocalization}}</h3>
  </abp-advanced-entity-filters-above-search>
  <abp-advanced-entity-filters-form>
    <form #filterForm (keyup.enter)="list.get()">
      <div class="row">
        <div class="col-12 col-sm-auto">
          <div class="mb-3">
            <label class="form-label" for="roleFilter">
              {{ '::Role' | abpLocalization }}
            </label>
            <abp-lookup-select
              id="roleFilter"
              (ngModelChange)="list.get()"
              [getFn]="staffService.getRoleLookup"
              [(ngModel)]="filters.roleId"
              [ngModelOptions]="{ standalone: true }">
            </abp-lookup-select>
          </div>
        </div>

        <div class="col-12 col-sm-auto align-self-end mb-3">
          <div class="row">
            <div class="col-6 col-sm-auto d-grid">
              <button type="button" class="btn btn-outline-primary" (click)="clearFilters()">
                <span>{{ '::Clear' | abpLocalization }}</span>
              </button>
            </div>
            <div class="col-6 col-sm-auto d-grid">
              <button type="button" class="btn btn-primary" (click)="list.get()">
                <span>{{ '::Refresh' | abpLocalization }}</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </form>
  </abp-advanced-entity-filters-form>
</abp-advanced-entity-filters>

<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">
          {{ '::Menu:Roles' | abpLocalization }}
        </h5>
      </div>
      <div class="text-end col col-md-6">
        <div class="text-lg-end pt-2">
          <button *abpPermission="'Vayu.Staffs.Create'" id="create" class="btn btn-primary" type="button" (click)="create()">
            <i class="fa fa-plus me-1"></i>
            <span>{{ "::NewStaff" | abpLocalization }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body">
    <ngx-datatable [rows]="staffs?.items" [count]="staffs?.totalCount" [list]="list" default>
      <ngx-datatable-column *ngIf="isDisplayActionMenu"
                            [name]="'::Actions' | abpLocalization"
                            [maxWidth]="150"
                            [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div ngbDropdown container="body" class="d-inline-block">
            <button
              class="btn btn-primary btn-sm dropdown-toggle"
              data-toggle="dropdown"
              aria-haspopup="true"
              ngbDropdownToggle>
              <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
            </button>
            <div ngbDropdownMenu>
              <button *abpPermission="'Vayu.Staffs.Edit'" ngbDropdownItem (click)="edit(row.id)">
                <i class="fa fa-pen-alt me-1"></i>
                {{ '::Edit' | abpLocalization }}
              </button>
              <button *abpPermission="'Vayu.Staffs.Delete'" ngbDropdownItem (click)="delete(row.id, row.name)">
                <i class="fa fa-trash-alt me-1"></i>
                {{ '::Delete' | abpLocalization }}
              </button>
            </div>
          </div>
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::Code' | abpLocalization" prop="code"></ngx-datatable-column>
      <ngx-datatable-column [name]="'::CodeName' | abpLocalization" prop="codeName"></ngx-datatable-column>
      <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="name"></ngx-datatable-column>
      <ngx-datatable-column [name]="'::Role' | abpLocalization" prop="role.name"></ngx-datatable-column>

      <!--<ngx-datatable-column [name]="'::CreationTime' | abpLocalization" prop="creationTime">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.creationTime | date }}
        </ng-template>
      </ngx-datatable-column>-->
    </ngx-datatable>
  </div>
</div>

<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <h3>{{ (selectStaff?.id ? '::Edit' :'::NewStaff') | abpLocalization }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-group">
        <label for="name">{{ '::Name'| abpLocalization}}</label><span> * </span>
        <input type="text" id="name" class="form-control" autofocus [formControl]="nameControl" />
      </div>
      <div class="form-group">
        <label for="roleId">{{ '::Role'| abpLocalization}}</label><span> * </span>
        <!--<select class="form-control" id="roleId" [formControl]="taskCategoryControl">
          <option [ngValue]="null">{{'::SelectTaskCategory' | abpLocalization}}</option>
          <option [ngValue]="type.value" *ngFor="let type of categoryOptions"> {{ '::Enum:TaskCategory:' + type.key | abpLocalization }}</option>
        </select>-->

        <abp-lookup-select
          id="roleId"
          [getFn]="staffService.getRoleLookup"
          [formControl]="roleControl">
        </abp-lookup-select>

      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>
      {{ '::Close' | abpLocalization }}
    </button>

    <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
      <i class="fa fa-check mr-1"></i>
      {{ '::Save' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
